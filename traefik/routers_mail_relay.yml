# ==============================================================================
# MAIL-RELAY MODULE - TRAEFIK ROUTERS
# ==============================================================================
# Description: HTTP routing rules for the mail relay service
# Author: Matt Barham
# Created: 2026-03-28
# Modified: 2026-04-22
# Version: 1.0.1
# Host: Your Server
# ==============================================================================
# Type: Traefik Dynamic Config (routers)
# Component: module: mail-relay
# Deployed by Spoke as: mod_mail_relay_routers_mail_relay.yml
# Dependencies:
#   - mod_mail_relay_services_mail_relay.yml (service definitions)
#   - hub middlewares (chain-agent-api)
#   - Environment variable: DOMAIN
# ==============================================================================

http:
  routers:
    #======================================================
    #==================== MAIL RELAY =====================
    #======================================================

    mail-relay:
      rule: Host(`relay.{{ env "DOMAIN" }}`)
      entryPoints: "websecure"
      priority: 100
      middlewares: chain-agent-api@file
      service: mail-relay-svc@file
